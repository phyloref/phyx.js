name: Publish Documentation

on:
  release:
    types: [published]
  workflow_dispatch:

# Pages is configured with "GitHub Actions" as its source, so the site is served from the
# artifact this workflow uploads. Pushing to a `gh-pages` branch would deploy nothing.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a release finish deploying before a manual run starts, rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-docs:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation
        run: npm run docs

      # jsdoc exits 0 when it finds no input files, leaving no site behind at all.
      - name: Check the site was generated
        run: test -s site/index.html && test -s site/context/v1.1.0/phyx.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
