# This workflow will test this Node.js package.
# For more information see: https://docs.github.com/en/actions/guides/building-and-testing-nodejs

name: Build and Test

# Execute on every pull request and if activated manually.
on: [pull_request, workflow_dispatch]

# The caching settings were based on https://docs.github.com/en/actions/guides/caching-dependencies-to-speed-up-workflows#example-using-the-cache-action
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 25.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Clean install dependencies from package-lock.json.
      run: npm ci

    - name: Build with NPM
      run: npm run build --if-present

    # Built before the tests rather than after them, because test/docs.mjs validates the
    # generated site: duplicate element ids, dead internal links, and classes that are
    # published but missing from the navigation. Those checks skip when site/ is absent
    # locally, but fail rather than skip when CI is set, so this step cannot go missing
    # without the test run saying so.
    #
    # `opts.strict` in jsdoc.config.js turns a bad option into a build failure, and
    # tutorials/build.mjs exits non-zero if a page's source has gone missing. Without this,
    # the release workflow is the first thing to find out.
    - name: Build the documentation
      run: npm run docs

    - name: Test with NPM
      run: npm test
