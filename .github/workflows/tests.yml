# This workflow will test this Node.js package.
# For more information see: https://docs.github.com/en/actions/guides/building-and-testing-nodejs

name: Build and Test

# Execute on every pull request and if activated manually.
on: [pull_request, workflow_dispatch]

# The caching settings were based on https://docs.github.com/en/actions/guides/caching-dependencies-to-speed-up-workflows#example-using-the-cache-action
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 25.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Clean install dependencies from package-lock.json.
      run: npm ci

    - name: Build with NPM
      run: npm run build --if-present

    - name: Test with NPM
      run: npm test

    # `opts.strict` in jsdoc.config.js turns a bad option into a build failure, and
    # tutorials/build.mjs exits non-zero if a page's source has gone missing.
    # Without this, the release workflow is the first thing to find out.
    #
    # The page check is not redundant: jsdoc prints "There are no input files
    # to process" and exits 0 if `source` matches nothing, leaving whatever was
    # in site/ untouched. A green build alone doesn't mean anything was built.
    - name: Check that the documentation builds
      run: |
        npm run docs
        test -f site/phyxwrapper/index.html
